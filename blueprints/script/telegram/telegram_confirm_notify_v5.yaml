alias: Telegram confirm prompt
description: >-
  Sends a Telegram message with 1-3 inline buttons, waits for a press (or
  timeout), updates the prompt message with the outcome, and returns the answer.
icon: mdi:chat-question
mode: parallel
max: 10
fields:
  chat_entity_id:
    name: Telegram entity
    required: true
    selector:
      entity:
        filter:
          - integration: telegram_bot
            domain: notify
  message:
    name: Prompt message
    required: true
    selector:
      template: {}
  button1:
    name: Button 1 text
    required: true
    default: Approve
    selector:
      text: {}
  reply1:
    name: Reply shown after button 1
    description: If not set, the message becomes "<prompt> → <button text>"
    selector:
      template: {}
  button2:
    name: Button 2 text (optional)
    selector:
      text: {}
  reply2:
    name: Reply shown after button 2
    selector:
      template: {}
  button3:
    name: Button 3 text (optional)
    selector:
      text: {}
  reply3:
    name: Reply shown after button 3
    selector:
      template: {}
  timeout_message:
    name: Reply shown on timeout
    description: If not set, the original prompt is kept, only the buttons are removed
    selector:
      template: {}
  timeout:
    name: Timeout in seconds
    description: Defaults to 300
    advanced: true
    selector:
      number:
        min: 10
        max: 900
        step: 5
sequence:
  - variables:
      commands:
        - /1-{{ this.context.id }}
        - /2-{{ this.context.id }}
        - /3-{{ this.context.id }}
      labels:
        - '{{ button1 | default('''', true) }}'
        - '{{ button2 | default('''', true) }}'
        - '{{ button3 | default('''', true) }}'
      replies:
        - '{{ reply1 | default('''', true) }}'
        - '{{ reply2 | default('''', true) }}'
        - '{{ reply3 | default('''', true) }}'
      inline_keyboard: >-
        {% set ns = namespace(k=[]) %} {% for i in range(3) if labels[i] |
        length > 0 %}
          {% set ns.k = ns.k + ["%s:%s" | format(labels[i][0:35], commands[i])] %}
        {% endfor %} {{ ns.k }}
  - action: telegram_bot.send_message
    data:
      entity_id: '{{ chat_entity_id }}'
      message: '{{ message }}'
      inline_keyboard: '{{ inline_keyboard }}'
    response_variable: sent
  - variables:
      sent_chat: '{{ (sent.chats | default([], true) | first | default({}, true)) }}'
      chat_id: '{{ sent.chats[0].chat_id | default(none) }}'
      message_id: '{{ sent.chats[0].message_id | default(none) }}'
  - wait_for_trigger:
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: '{{ commands[0] }}'
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: '{{ commands[1] }}'
      - trigger: event
        event_type: telegram_callback
        event_data:
          command: '{{ commands[2] }}'
    timeout:
      seconds: '{{ timeout | default(300, true) }}'
    continue_on_timeout: true
  - variables:
      index: |-
        {{ commands.index(wait.trigger.event.data.command)
           if wait.completed else none }}
      answer: '{{ ''button'' ~ (index + 1) if index is not none else ''timeout'' }}'
      final_text: |-
        {% if index is none %}
          {{ timeout_message if (timeout_message | default('', true) | length > 0) else message }}
        {% elif replies[index] | length > 0 %}
          {{ replies[index] }}
        {% else %}
          {{ message }} → {{ labels[index] }}
        {% endif %}
  - if:
      - condition: template
        value_template: '{{ wait.completed }}'
    then:
      - action: telegram_bot.answer_callback_query
        data:
          config_entry_id: '{{ wait.trigger.event.data.bot.config_entry_id }}'
          callback_query_id: '{{ wait.trigger.event.data.id }}'
          message: >-
            {{ (replies[index] if replies[index] | length > 0 else
            labels[index])[0:200] }}
  - if:
      - condition: template
        value_template: '{{ message_id is not none }}'
    then:
      - action: telegram_bot.edit_message
        data:
          entity_id: '{{ chat_entity_id }}'
          message_id: '{{ message_id | int }}'
          message: '{{ final_text | trim }}'
    else:
      - action: telegram_bot.send_message
        data:
          entity_id:
            - '{{ chat_entity_id }}'
          message: '{{ final_text | trim }}'
  - variables:
      response_variable:
        answer: '{{ answer }}'
        chat_id: '{{ chat_id }}'
        message_id: '{{ message_id }}'
  - stop: Done
    response_variable: response_variable
